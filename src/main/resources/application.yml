server:
  port: ${SERVER_PORT:8080}

svc:
  user:
    base-url: ${SVC_USER_BASE_URL:http://localhost:8081}
  course:
    base-url: ${SVC_COURSE_BASE_URL:http://localhost:8082}
    internal-api-key: ${SVC_COURSE_INTERNAL_API_KEY:dev-course-service-internal-key}
  learning:
    base-url: ${SVC_LEARNING_BASE_URL:http://localhost:8083}

spring:
  main:
    banner-mode: console
  web:
    resources:
      add-mappings: false

logging:
  level:
    org.studyplatform.bff: INFO
    org.springframework.web.reactive.function.client: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

bff:
  proxy:
    timeout-seconds: ${BFF_PROXY_TIMEOUT_SECONDS:5}
    learning-run-submit-timeout-seconds: ${BFF_PROXY_LEARNING_RUN_SUBMIT_TIMEOUT_SECONDS:60}
  auth:
    cookies:
      access-name: ${BFF_AUTH_ACCESS_COOKIE_NAME:access_token}
      refresh-name: ${BFF_AUTH_REFRESH_COOKIE_NAME:refresh_token}
      secure: ${BFF_AUTH_COOKIE_SECURE:true}
      same-site: ${BFF_AUTH_COOKIE_SAME_SITE:Lax}
      path: ${BFF_AUTH_COOKIE_PATH:/}
      domain: ${BFF_AUTH_COOKIE_DOMAIN:}
