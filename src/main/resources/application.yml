server:
  port: 8080

svc:
  user:
    base-url: ${SVC_USER_BASE_URL:http://localhost:8081}
  course:
    base-url: ${SVC_COURSE_BASE_URL:http://localhost:8082}

spring:
  main:
    banner-mode: console
  web:
    resources:
      add-mappings: false

logging:
  level:
    org.studyplatform.bff: INFO
    org.springframework.web.reactive.function.client: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
