name: BFF CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: bff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, test and Docker check
    runs-on: ubuntu-latest

    env:
      SERVER_PORT: 8080
      SVC_USER_BASE_URL: http://localhost:8081
      SVC_COURSE_BASE_URL: http://localhost:8082
      SVC_LEARNING_BASE_URL: http://localhost:8090

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: mvn -B clean verify

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: studybytes/bff:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy BFF to VPS
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment:
      name: production

    steps:
      - name: Validate required deployment secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_DEPLOY_BASE_PATH: ${{ secrets.VPS_DEPLOY_BASE_PATH }}
        run: |
          test -n "$VPS_HOST" || (echo "VPS_HOST secret is missing" && exit 1)
          test -n "$VPS_PORT" || (echo "VPS_PORT secret is missing" && exit 1)
          test -n "$VPS_USER" || (echo "VPS_USER secret is missing" && exit 1)
          test -n "$VPS_SSH_KEY" || (echo "VPS_SSH_KEY secret is missing" && exit 1)
          test -n "$VPS_DEPLOY_BASE_PATH" || (echo "VPS_DEPLOY_BASE_PATH secret is missing" && exit 1)

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/bff_deploy_key
          chmod 600 ~/.ssh/bff_deploy_key
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_BASE_PATH: ${{ secrets.VPS_DEPLOY_BASE_PATH }}
          BFF_HEALTHCHECK_URL: ${{ secrets.BFF_HEALTHCHECK_URL }}
        run: |
          DEPLOY_SERVICE_DIR="bff"
          HEALTHCHECK_URL="${BFF_HEALTHCHECK_URL:-http://127.0.0.1:8080/health}"
          ssh -i ~/.ssh/bff_deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "set -euo pipefail
             DEPLOY_PATH='${VPS_DEPLOY_BASE_PATH%/}/$DEPLOY_SERVICE_DIR'
             if [ ! -d \"\$DEPLOY_PATH/.git\" ]; then
               mkdir -p \"\$DEPLOY_PATH\"
               git clone 'https://github.com/${{ github.repository }}.git' \"\$DEPLOY_PATH\"
             fi
             cd \"\$DEPLOY_PATH\"
             git config --global --add safe.directory \"\$DEPLOY_PATH\"
             git fetch origin main
             git checkout main
             git pull --ff-only origin main
             if [ ! -f .env ]; then
               cp .env.example .env
             fi
             docker compose up -d --build
             docker compose ps
             for attempt in \$(seq 1 40); do
               if curl -fsS '$HEALTHCHECK_URL'; then
                 exit 0
               fi
               echo \"Waiting for BFF health check... attempt \$attempt/40\"
               sleep 3
             done
             docker compose logs --tail=200 bff
             exit 1"
